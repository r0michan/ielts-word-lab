<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS単語ラボ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D9506A">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Nunito:wght@600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one centred study column — CEFR band map on top, filters, tab rail, then the active workspace. */
:root{
  --bg:#FFF8F2; --surface:#FFFFFF; --sunk:#FFF1E7; --ink:#3D2E2E; --muted:#8B7770; --line:#F2DDD0;
  --accent:#D9506A; --accent-soft:#FFE3E8; --on-accent:#FFFFFF;
  --good:#2E9E6E; --good-soft:#DDF6EA; --bad:#D9483B; --bad-soft:#FFE4E0; --warn:#B86E0E; --warn-soft:#FFF0D6;
  --lvA:#3E9A4E; --lvB:#4A72C9; --lvC:#A2559C;
  --c1:#D9506A; --c2:#F08A3C; --c3:#6F7FE8;
  --sky:#EAF6FF; --shadow:0 3px 0 rgba(217,80,106,.07),0 8px 22px rgba(120,70,60,.07);
  --f-word:"Nunito","Zen Maru Gothic",system-ui,sans-serif;
  --f-ipa:"Charis SIL","Charis","Georgia",serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1A22; --surface:#2A2430; --sunk:#332B3A; --ink:#F5EAE6; --muted:#BBA9A8; --line:#43384A;
  --accent:#FF8FA3; --accent-soft:#4A2A36; --on-accent:#2A0F17;
  --good:#6FD6A0; --good-soft:#1F3A2E; --bad:#FF8B80; --bad-soft:#47231F; --warn:#F2B860; --warn-soft:#44341A;
  --lvA:#8FD68A; --lvB:#9DB8FF; --lvC:#E2A4DC;
  --c1:#FF8FA3; --c2:#FFB07A; --c3:#A0ACFF; --sky:#2C2A3C; --shadow:0 3px 0 rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1E1A22; --surface:#2A2430; --sunk:#332B3A; --ink:#F5EAE6; --muted:#BBA9A8; --line:#43384A;
  --accent:#FF8FA3; --accent-soft:#4A2A36; --on-accent:#2A0F17;
  --good:#6FD6A0; --good-soft:#1F3A2E; --bad:#FF8B80; --bad-soft:#47231F; --warn:#F2B860; --warn-soft:#44341A;
  --lvA:#8FD68A; --lvB:#9DB8FF; --lvC:#E2A4DC;
  --c1:#FF8FA3; --c2:#FFB07A; --c3:#A0ACFF; --sky:#2C2A3C; --shadow:0 3px 0 rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700;letter-spacing:.02em}
.top h1 span{font-family:var(--f-word);font-weight:400;color:var(--accent)}
.bandmap{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.band{padding:10px 10px 9px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.band:first-child{border-left:0}
.band b{font-family:var(--f-word);font-size:20px;line-height:1}
.band .cam{font-size:11.5px;color:var(--muted);line-height:1.35}
.band .ie{font-size:12px;font-variant-numeric:tabular-nums}
.band .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.band.target{background:var(--accent-soft)}
.band.target .ie::after{content:" ← 6.5";color:var(--accent);font-weight:700}
.band[data-g="A"] b{color:var(--lvA)} .band[data-g="B"] b{color:var(--lvB)} .band[data-g="C"] b{color:var(--lvC)}
@media (max-width:640px){.bandmap{grid-template-columns:repeat(3,1fr)}.band:nth-child(4){border-left:0}.band:nth-child(n+4){border-top:1px solid var(--line)}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px;font-family:var(--f-word)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preset{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
select{max-width:100%;min-width:0}
select,input[type=text],input[type=search],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* tabs */
.tabrail{overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;min-width:max-content}
.tab{border:0;background:none;padding:10px 13px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.modeseg{display:inline-flex;align-self:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:8px;flex:none}
.modeseg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.modeseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tab .new{font-size:10px;color:var(--accent);margin-left:3px;vertical-align:top}

/* generic */
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.btn.big{padding:12px 20px;font-size:16px}
kbd{font-family:var(--f-word);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.lv{display:inline-block;font-family:var(--f-word);font-weight:700;font-size:12.5px;padding:1px 8px;border-radius:5px;border:1px solid currentColor;line-height:1.5}
.lv-A{color:var(--lvA)} .lv-B{color:var(--lvB)} .lv-C{color:var(--lvC)}
.tag{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:5px;padding:1px 7px}
.hw{font-family:var(--f-word);font-size:clamp(34px,7vw,52px);font-weight:700;line-height:1.1;letter-spacing:.005em;overflow-wrap:anywhere}
.ipa{font-family:var(--f-word);font-size:19px;color:var(--muted)}
.ja{font-size:22px;font-weight:700}
.ex{font-family:var(--f-word);font-size:18px;line-height:1.55}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.err{color:var(--bad);font-size:14px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
audio{max-width:100%;height:36px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* flashcard */
.deckbar{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;font-variant-numeric:tabular-nums}
.deckbar b{font-size:18px;font-family:var(--f-word)}
.flash{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.flash .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reveal{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;width:100%}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.grade .btn{justify-content:center;padding:13px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;flex:1;min-width:120px;position:relative}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.dual i{position:absolute;left:0;top:0}.meter.dual i:first-child{opacity:.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 14px;cursor:pointer;font-size:16px}
.opt.en{font-family:var(--f-word);font-size:19px}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.ng{background:var(--bad-soft);border-color:var(--bad)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode b{font-size:16px}

/* pronunciation */
.score{--v:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--sc,var(--accent)) calc(var(--v)*1%),var(--sunk) 0)}
.score span{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-word);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.result .txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.heard{font-family:var(--f-word);font-size:18px}
.tok{font-family:var(--f-word);font-size:19px;line-height:1.8}
.tok .h{color:var(--good);border-bottom:2px solid var(--good)}
.tok .m{color:var(--bad);border-bottom:2px dotted var(--bad)}
.tok .x{color:var(--muted);text-decoration:line-through}

/* sentence trainer */
.sentq{font-family:var(--f-word);font-size:21px;line-height:1.5}
.slot{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.slot.ok{border-color:var(--good);background:var(--good-soft)} .slot.ng{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-word);font-size:18px;border:1px solid var(--line);background:var(--surface);border-bottom-width:2.5px;border-radius:8px;padding:5px 11px;cursor:pointer;line-height:1.3}
.tile:hover{border-color:var(--accent)}
.tile.wrong{border-color:var(--bad);color:var(--bad)}
.tile.used{visibility:hidden}
.pat{display:inline-block;font-family:var(--f-word);font-size:16px;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:2px 9px}
.blank{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem .en{font-family:var(--f-word);font-size:17px}
.pitem .jp{font-size:13.5px;color:var(--muted)}
.pitem .tp{font-size:12.5px;color:var(--muted)}

/* writing */
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:880px){.wgrid{grid-template-columns:minmax(0,1fr)}}
.prompt{font-family:var(--f-word);font-size:17.5px;line-height:1.55;white-space:pre-line}
.prompt ul{margin:6px 0 0;padding-left:22px}
.chartbox{overflow-x:auto;background:var(--sunk);border-radius:10px;padding:10px}
.chartbox svg{display:block;width:100%;min-width:420px;height:auto}
.chartbox text{fill:var(--muted);font:12px var(--f-ui)}
.chartbox .grid{stroke:var(--line)}
#essay{width:100%;min-height:360px;font-family:var(--f-word);font-size:17px;line-height:1.7;resize:vertical;padding:14px}
.wstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;font-variant-numeric:tabular-nums}
.wstat b{font-family:var(--f-word);font-size:17px}
.wclock{font-family:var(--f-word);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:880px){.side{position:static;max-height:none}}
.phr{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:var(--f-word);font-size:14.5px;line-height:1.4}
.phr:hover{border-color:var(--accent)}
.phr small{display:block;font-family:var(--f-ui);font-size:11.5px;color:var(--muted)}
.fb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fb li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.fb .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.fb .ok .ic{background:var(--good-soft);color:var(--good)}
.fb .warn .ic{background:var(--warn-soft);color:var(--warn)}
.fb .bad .ic{background:var(--bad-soft);color:var(--bad)}
.fb b{font-weight:700}
.fb .d{font-size:13.5px;color:var(--muted)}
.fb .hits{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.fb .hits span{font-family:var(--f-word);font-size:14px;background:var(--sunk);border-radius:5px;padding:0 7px}
.marked{font-family:var(--f-word);font-size:16.5px;line-height:1.8;white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:14px;overflow-wrap:anywhere}
.mk-err{background:var(--bad-soft);color:var(--bad);border-bottom:2px solid var(--bad)}
.mk-inf{background:var(--warn-soft);border-bottom:2px dotted var(--warn)}
.mk-link{border-bottom:2px solid var(--c3)}
.mk-voc{background:var(--accent-soft);border-radius:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.model{font-family:var(--f-word);font-size:16.5px;line-height:1.75;white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:14px}
.drafts{display:flex;flex-direction:column;gap:6px}
.draft{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;border-top:1px solid var(--line);padding-top:6px}
.aihead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.aiband{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.aiband .stat span{display:block;line-height:1.4}
.aiband .stat b{font-size:24px;margin-top:4px}
.aiband .stat p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.aiband .stat.all{background:var(--accent-soft)}
.corr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.corr li{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.corr li:first-child{border-top:0}
.corr .o{font-family:var(--f-word);font-size:15.5px;color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.corr .c{font-family:var(--f-word);font-size:16.5px;color:var(--good)}
.corr .c::before{content:"→ ";color:var(--muted)}
.corr .r{font-size:13.5px;color:var(--muted)}
.prio{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.keyinput{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:14px}

/* speaking */
.cue{font-family:var(--f-word);font-size:20px;line-height:1.5}
.cue ul{margin:8px 0 0;padding-left:22px;font-size:17px}
.clock{font-family:var(--f-word);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock small{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--muted);display:block;margin-top:4px}
.transcript{font-family:var(--f-word);font-size:17px;line-height:1.7;background:var(--sunk);border-radius:10px;padding:14px;min-height:90px;overflow-wrap:anywhere}
.transcript i{color:var(--muted)}
.transcript mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--f-word);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.wordpills{display:flex;flex-wrap:wrap;gap:6px}
.wp{font-family:var(--f-word);font-size:15px;border:1px solid var(--line);border-radius:7px;padding:2px 9px;background:var(--surface);cursor:pointer}

/* list */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--sunk)}
td.w{font-family:var(--f-word);font-size:16.5px;font-weight:700;white-space:nowrap}
td.i{font-family:var(--f-word);color:var(--muted);white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.st{font-size:12px;border-radius:5px;padding:1px 7px;white-space:nowrap}
.st0{background:var(--sunk);color:var(--muted)} .st1{background:var(--bad-soft);color:var(--bad)} .st2{background:var(--accent-soft);color:var(--accent)} .st3{background:var(--good-soft);color:var(--good)}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--accent);padding:2px}
.iconbtn svg{width:18px;height:18px}
.lvbars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:560px){.lvbars{grid-template-columns:repeat(3,1fr)}}
.lvbar{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-variant-numeric:tabular-nums}
.lvbar .meter{min-width:0;flex:none}

/* settings */
.form{display:grid;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
textarea{width:100%;min-height:130px;font-family:var(--f-word);font-size:14px}
.support{display:flex;gap:10px;flex-wrap:wrap}
.support span{font-size:13px;border-radius:6px;padding:3px 9px;background:var(--sunk)}
.support .y{color:var(--good)} .support .n{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:9px;padding:10px 12px;font-size:14px}

.subrail{margin-top:2px}
.subrail .tabs{gap:2px;padding:2px}

<script>
const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const LEVEL_INFO = {
  A1:{cam:'A1 Movers',      ie:'—'},
  A2:{cam:'A2 Key (KET)',   ie:'〜3.5'},
  B1:{cam:'B1 Preliminary', ie:'4.0–5.0'},
  B2:{cam:'B2 First',       ie:'5.5–6.5', target:true},
  C1:{cam:'C1 Advanced',    ie:'7.0–8.0', target:true},
  C2:{cam:'C2 Proficiency', ie:'8.5–9.0'},
};
const TOPICS = {daily:'日常',city:'都市・住居',travel:'旅行',work:'仕事',edu:'教育',health:'健康',env:'環境',tech:'テクノロジー',soc:'社会',econ:'経済',gov:'政治・行政',acad:'アカデミック'};
const POS = {n:'名詞',v:'動詞',adj:'形容詞',adv:'副詞',prep:'前置詞',conj:'接続詞',det:'限定詞',phr:'句'};
const DAY = 864e5;
const INTERVALS = [0, DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];

const SPEAK_Q = [
  {p:1,q:'Do you work or are you a student?',tags:['work','edu']},
  {p:1,q:'What do you like about your hometown?',tags:['city','soc']},
  {p:1,q:'How often do you use public transport?',tags:['city','travel']},
  {p:1,q:'Do you prefer reading books or watching films?',tags:['daily','edu']},
  {p:1,q:'What kind of food do you usually eat?',tags:['health','daily']},
  {p:1,q:'How do you usually spend your weekends?',tags:['daily']},
  {p:1,q:'Is it important for you to learn a foreign language?',tags:['edu']},
  {p:1,q:'Do you use your phone a lot during the day?',tags:['tech']},
  {p:2,q:'Describe a place you visited that you would like to go back to.',b:['where it is','when you went there','what you did there','and explain why you would like to go back'],tags:['travel','city']},
  {p:2,q:'Describe a skill you learned that you think is useful.',b:['what the skill is','when and how you learned it','how often you use it','and explain why it is useful'],tags:['edu','work']},
  {p:2,q:'Describe a time when you helped someone.',b:['who you helped','what the situation was','how you helped','and explain how you felt about it'],tags:['soc']},
  {p:2,q:'Describe a piece of technology you use every day.',b:['what it is','when you started using it','what you use it for','and explain how your life would be different without it'],tags:['tech']},
  {p:3,q:'Does tourism bring more benefits or problems to local communities?',tags:['travel','econ','soc']},
  {p:3,q:'How has technology changed the way people work?',tags:['tech','work']},
  {p:3,q:'Should governments spend more on public transport or on roads?',tags:['gov','city','env']},
  {p:3,q:'What can individuals do to protect the environment?',tags:['env']},
  {p:3,q:'Is a university degree necessary for success today?',tags:['edu','work']},
  {p:3,q:'Why do some people prefer to live in rural areas?',tags:['city','soc']},
];
const PART = {1:{prep:0,talk:40,name:'Part 1 · 短い質問'},2:{prep:60,talk:120,name:'Part 2 · スピーチ'},3:{prep:0,talk:75,name:'Part 3 · 議論'}};

const ICON = {
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const lvG = lv => lv[0];
const lvChip = lv => `<span class="lv lv-${lvG(lv)}">${lv}</span>`;

function parseLine(line, src, level) {
  const sep = line.includes('\t') ? '\t' : '|';
  let f = line.split(sep).map(s => s.trim());
  if (level) f = [f[0], level, ...f.slice(1)];
  if (f.length < 5) return null;
  const [w, lv, pos, ipa, ja, ex = '', tags = ''] = f;
  const L = (lv || '').toUpperCase();
  if (!w || !LEVELS.includes(L)) return null;
  return {id: w.toLowerCase(), w, lv: L, pos, ipa: (ipa || '').replace(/^\/|\/$/g, ''), ja, ex, tags: tags.split(/[,;\s]+/).filter(Boolean), src};
}
const BASE = [];
(window.WORD_DATA || []).forEach(([lv, body]) => body.trim().split('\n').forEach(l => { const w = l.trim() && parseLine(l, 'base', lv); if (w) BASE.push(w); }));

const SCATS = window.SENTENCE_CATS || {};
const SENT = (window.SENTENCE_RAW || '').trim().split('\n').map(l => {
  const [cat, pat, en, ja, tip] = l.split('|').map(s => s.trim());
  return en ? {id: 'p:' + en, cat, pat, en, ja, tip} : null;
}).filter(Boolean);
const W = window.WRITING;

/* ---------- persisted state ---------- */
const KEY = 'ieltsWordLab.v1';
let S = {levels:['B1','B2','C1'], topic:'all', tab:'card', prog:{}, custom:[], settings:{accent:'en-GB', rate:1, voice:''}, sprog:{}, wtext:{}, drafts:[]};
try {
  const d = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (d) S = {...S, ...d, settings:{...S.settings, ...(d.settings || {})}};
} catch (e) {}
let saveTimer = null;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); }

let WORDS = [];
function rebuild() {
  const m = new Map();
  BASE.forEach(w => { if (!m.has(w.id)) m.set(w.id, w); });
  S.custom.forEach(w => m.set(w.id, w));
  WORDS = [...m.values()].sort((a, b) => LEVELS.indexOf(a.lv) - LEVELS.indexOf(b.lv));
  formCache = null;
}
let formCache = null;
rebuild();
const filtered = () => WORDS.filter(w => S.levels.includes(w.lv) && (S.topic === 'all' || w.tags.includes(S.topic)));
const P = id => S.prog[id] || (S.prog[id] = {box:0, due:0, seen:0, qc:0, qw:0, pb:null});
const peek = id => S.prog[id];
function status(id) { const p = peek(id); if (!p || !p.seen) return 0; if (p.box <= 1) return 1; if (p.box <= 3) return 2; return 3; }
const STATUS = ['未学習','要復習','学習中','定着'];

/* ---------- transient UI state ---------- */
const ui = {
  revealed:false, cram:false, confirm:null, search:'', importMsg:'',
  quiz:null,
  pron:{i:0, mode:'word', busy:false, result:null, err:'', audio:null, rec:null},
  spk:{part:1, qi:0, phase:'idle', final:'', interim:'', t0:0, t1:0, end:0, timer:null, rec:null, recorder:null, audio:null, err:''},
  sent:{mode:'order', src:'pat', cat:'all', item:null, order:[], picked:[], checked:null, typed:'', showTip:false, result:null, busy:false, rec:null, err:'', audio:null},
  write:{task:'t2', pi:null, end:0, timer:null, showModel:false, feedback:null, bankCat:'opinion', confirm:false, msg:'', ai:null},
};
ui.spk.qi = SPEAK_Q.findIndex(q => q.p === 1);

/* ---------- speech: synthesis ---------- */
const TTS = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const REC_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let voices = [];
function loadVoices() { if (!TTS) return; voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); if (S.tab === 'settings') setTimeout(render); }  // voices can arrive before the views are defined
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  if (S.settings.voice) { const v = voices.find(v => v.voiceURI === S.settings.voice); if (v) return v; }
  const lang = S.settings.accent.toLowerCase();
  return voices.find(v => v.lang.toLowerCase().replace('_','-') === lang && /natural|online|google/i.test(v.name))
      || voices.find(v => v.lang.toLowerCase().replace('_','-') === lang) || null;
}
function speak(text, slow) {
  if (!TTS || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = v ? v.lang : S.settings.accent;
  u.rate = (slow ? 0.6 : 1) * S.settings.rate;
  speechSynthesis.speak(u);
}

/* ---------- speech: recognition + recording ---------- */
function srError(code) {
  return ({
    'not-allowed':'マイクの使用が許可されていません。アドレスバー左のアイコンからマイクを許可してください。',
    'service-not-allowed':'このブラウザでは音声認識が使えません。Chrome か Edge で開いてください。',
    'no-speech':'声が検出されませんでした。マイクに近づいてもう一度どうぞ。',
    'audio-capture':'マイクが見つかりません。接続を確認してください。',
    'network':'音声認識サービスに接続できません。インターネット接続を確認してください。',
  })[code] || `音声認識でエラーが発生しました (${code})`;
}
async function startRecorder() {
  if (!REC_OK) return null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(res => mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      res(URL.createObjectURL(new Blob(chunks, {type: mr.mimeType || 'audio/webm'})));
    });
    mr.start();
    return {stop: () => { if (mr.state !== 'inactive') mr.stop(); return done; }};
  } catch (e) { return null; }
}
// One utterance: records the voice and recognises it; `state` holds busy/rec/err/audio for the view.
async function listenOnce(state, onResult, view) {
  if (state.busy) { state.rec?.stop(); return; }
  if (TTS) speechSynthesis.cancel();
  state.busy = true; state.err = ''; render();
  const recorder = await startRecorder();
  const r = new SR(); r.lang = S.settings.accent; r.maxAlternatives = 5; r.interimResults = false; r.continuous = false;
  let alts = [];
  r.onresult = e => { alts = Array.from(e.results[0]).map(a => ({t: a.transcript, c: a.confidence})); };
  r.onerror = e => { if (e.error !== 'aborted') state.err = srError(e.error); };
  r.onend = async () => {
    state.busy = false; state.rec = null;
    if (recorder) { const url = await recorder.stop(); if (state.audio) URL.revokeObjectURL(state.audio); state.audio = url; }
    if (alts.length) onResult(alts); else if (!state.err) state.err = '聞き取れませんでした。もう一度どうぞ。';
    if (S.tab === view) render();
  };
  state.rec = r;
  try { r.start(); } catch (e) { state.busy = false; state.err = srError('service-not-allowed'); recorder?.stop(); render(); }
}

/* ---------- text matching ---------- */
const norm = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z'\s-]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
// British → American spellings, applied to both sides so either accent's recogniser can match
const us = s => s.replace(/our\b/g, 'or').replace(/is(e|ed|es|ing|ation)\b/g, 'iz$1').replace(/yse\b/g, 'yze').replace(/tre\b/g, 'ter').replace(/ogue\b/g, 'og');
const key = s => us(norm(s));
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
function forms(w) {
  const b = key(w); const f = new Set([b, b + 's', b + 'es', b + 'ed', b + 'd', b + 'ing', b + 'ly', b + 'er']);
  if (b.endsWith('e')) f.add(b.slice(0, -1) + 'ing');
  if (b.endsWith('y')) { f.add(b.slice(0, -1) + 'ies'); f.add(b.slice(0, -1) + 'ied'); }
  if (/[^aeiou][aeiou][bdgmnprt]$/.test(b)) { const d = b + b.slice(-1); f.add(d + 'ed'); f.add(d + 'ing'); }
  return f;
}
// form → word, for single-word entries B1 and above
function formIndex() {
  if (formCache) return formCache;
  formCache = new Map();
  WORDS.forEach(w => { if (LEVELS.indexOf(w.lv) >= 2 && !/\s/.test(w.w)) forms(w.w).forEach(f => { if (!formCache.has(f)) formCache.set(f, w); }); });
  return formCache;
}
function scoreWord(target, alts) {
  const t = key(target); let best = 0, heard = alts[0]?.t || '';
  for (const a of alts) {
    const k = key(a.t); const toks = k.split(' ');
    let s = toks.includes(t) || k === t ? 1 : Math.max(sim(k, t), ...toks.map(x => sim(x, t)));
    if (s > best) { best = s; heard = a.t; }
  }
  return {score: Math.round(best * 100), heard};
}
function scoreSentence(target, alts) {
  const words = target.split(/\s+/);
  let best = null;
  for (const a of alts) {
    const heard = key(a.t).split(' ');
    const marks = words.map(w => { const k = key(w); if (!k) return true; return heard.some(h => h === k || sim(h, k) >= 0.8); });
    const counted = words.filter(w => key(w)).length || 1;
    const s = Math.round(marks.filter((m, i) => m && key(words[i])).length / counted * 100);
    if (!best || s > best.score) best = {score: s, heard: a.t, marks};
  }
  return {...best, words};
}
// word-level LCS diff: which model words the learner produced, and which of theirs are extra
function diffWords(model, answer) {
  const A = model.split(/\s+/), B = answer.trim() ? answer.trim().split(/\s+/) : [];
  const a = A.map(key), b = B.map(key);
  const dp = Array.from({length: a.length + 1}, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] && a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const mHit = new Array(A.length).fill(false), bHit = new Array(B.length).fill(false);
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] && a[i] === b[j]) { mHit[i] = bHit[j] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const counted = a.filter(Boolean).length || 1;
  return {A, B, mHit, bHit, score: Math.round(mHit.filter((h, k) => h && a[k]).length / counted * 100)};
}

/* ---------- rendering ---------- */
// other exams at the same CEFR level (目安 — full table in スコア換算・試験比較)
const BAND_EQ = {A1: '英検3〜5級', A2: '英検準2級 · TOEIC 225+', B1: '英検2級 · TOEIC 550+', B2: '英検準1級 · TOEIC 785+', C1: '英検1級 · TOEIC 945+', C2: ''};
function renderBand() {
  const n = l => WORDS.filter(w => w.lv === l).length;
  $('#bandmap').innerHTML = LEVELS.map(l => { const i = LEVEL_INFO[l];
    return `<div class="band${i.target ? ' target' : ''}" data-g="${lvG(l)}"><b>${l}</b><span class="cam">${i.cam}</span><span class="ie">IELTS ${i.ie}</span>${BAND_EQ[l] ? `<span class="n eq">${BAND_EQ[l]}</span>` : ''}<span class="n">${n(l)}語</span></div>`; }).join('');
}
const NO_FILTER = ['write', 'speak', 'settings'];
function renderFilters() {
  const el = $('#filters');
  el.hidden = NO_FILTER.includes(S.tab) || ['read', 'score', 'expr', 'home', 'listen', 'japan', 'notes', 'mock', 'lessons', 'images', 'dict', 'vocab', 'tests'].includes(S.tab) ||(S.tab === 'sent' && ui.sent.src === 'pat');
  if (el.hidden) return;

/* --- sentence trainer --- */
const SMODES = {

const patKeys = p => key(p.pat.replace(/~|\.\.\./g, ' ').replace(/\b[AB]\b/g, ' ')).split(' ').filter(w => w.length > 1 || w === 'a');
function sentPool() {
  if (ui.sentPool) return ui.sentPool;

  return filtered().filter(w => w.ex && w.ex.split(/\s+/).length >= 4 && /[.?!]$/.test(w.ex))

function clozeTarget(item) {
  const toks = item.en.split(/\s+/);

    const f = forms(item.w.w);
    const i = toks.findIndex(t => f.has(key(t)));
    return i >= 0 ? i : -1;
  }
  const STOP = new Set(['there','that','this','these','those','with','from','which','have','been','will','would','should','could','what','when','than','about','into','some','your','their','they','them','very','more','most','such','also','even','while','other','because']);
  const ks = patKeys(item).filter(k => k.length >= 4 && !STOP.has(k)).sort((a, b) => b.length - a.length);

}

function chartSVG(c) {
  const Wd = 600, H = 300, L = 46, R = 14, T = 14, B = 58;
  const all = c.series.flatMap(s => s[1]), max0 = Math.max(...all);
  const step = max0 > 50 ? 20 : max0 > 20 ? 5 : 2, max = Math.ceil(max0 / step) * step || step;
  const y = v => T + (H - T - B) * (1 - v / max), cols = ['var(--c1)', 'var(--c2)', 'var(--c3)'];
  let g = '';
  for (let v = 0; v <= max; v += step) g += `<line class="grid" x1="${L}" x2="${Wd - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const n = c.x.length, cw = (Wd - L - R) / n;
  let marks = '';
  if (c.type === 'line') {
    const x = i => L + cw * (i + 0.5);
    c.series.forEach(([name, vals], si) => {
      marks += `<polyline fill="none" stroke="${cols[si]}" stroke-width="2.5" points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>`;
      marks += vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${cols[si]}"/>`).join('');
    });
    marks += c.x.map((t, i) => `<text x="${x(i)}" y="${H - B + 18}" text-anchor="middle">${esc(t)}</text>`).join('');
  } else {
    const k = c.series.length, bw = Math.min(26, (cw - 16) / k);
    c.series.forEach(([name, vals], si) => vals.forEach((v, i) => {
      const x0 = L + cw * i + (cw - bw * k) / 2 + bw * si;
      marks += `<rect x="${x0}" y="${y(v)}" width="${bw - 2}" height="${y(0) - y(v)}" fill="${cols[si]}" rx="2"/>`;
    }));
    marks += c.x.map((t, i) => `<text x="${L + cw * (i + 0.5)}" y="${H - B + 18}" text-anchor="middle">${esc(t)}</text>`).join('');
  }
  const leg = c.series.map(([name], si) => `<rect x="${L + si * 120}" y="${H - 18}" width="12" height="12" rx="2" fill="${cols[si]}"/><text x="${L + si * 120 + 18}" y="${H - 8}">${esc(name)}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="練習用グラフ">${g}<text x="${L}" y="${T - 2}" style="font-size:11px">(${esc(c.unit)})</text>${marks}${leg}</svg>`;
}

const cleanText = t => t.split('\n').filter(l => !/^\s*\[.*\]\s*$/.test(l)).join('\n');
const splitSentences = t => t.replace(/\n+/g, ' \n ').split(/(?<=[.!?])\s+|\n/).map(x => x.trim()).filter(x => /[A-Za-z]/.test(x));

function analyzeWriting(raw, p) {
  const out = [], marks = [];
  const placeholders = (raw.match(/_{3,}/g) || []).length;
  const text = cleanText(raw);
  const task = W.tasks[p.task];
  const words = text.match(/[A-Za-z][A-Za-z'’-]*/g) || [];
  const paras = text.split(/\n\s*\n/).filter(x => x.trim());
  const sents = splitSentences(text);
  const formal = p.task !== 'gt1' || p.style !== 'informal';
  const add = (lv, title, detail, hits) => out.push({lv, title, detail, hits});

  if (placeholders) add('bad', `空欄（______）が ${placeholders} か所残っています`, '型の空欄を自分の言葉で埋めましょう。[ ] の行は自動で無視されます。');
  // length & structure
  add(words.length >= task.min ? 'ok' : 'bad', `語数 ${words.length} 語（${task.min} 語以上が必要）`,
    words.length >= task.min ? '条件を満たしています。' : `あと ${task.min - words.length} 語必要です。足りないと減点されます。`);
  const needP = p.task === 't2' ? 4 : p.task === 'gt1' ? 4 : 3;
  add(paras.length >= needP ? 'ok' : 'warn', `段落 ${paras.length} 個`, paras.length >= needP ? '段落分けができています。' : `${needP} 段落以上に分け、段落の間は空行にしましょう。`);
  // sentences
  const lens = sents.map(s => (s.match(/[A-Za-z][A-Za-z'’-]*/g) || []).length);
  const avg = lens.length ? Math.round(lens.reduce((a, b) => a + b, 0) / lens.length) : 0;
  const long = sents.filter((s, i) => lens[i] > 35), short = sents.filter((s, i) => lens[i] > 0 && lens[i] < 6);
  add(avg >= 12 && avg <= 25 ? 'ok' : 'warn', `1文の平均 ${avg} 語`, avg < 12 ? '短い文が多めです。because / which / although などで文をつなげましょう。' : avg > 25 ? '1文が長めです。長い文は2つに分けると読みやすくなります。' : '読みやすい長さです。',
    long.map(s => s.slice(0, 60) + '…'));
  const SUB = /\b(because|although|though|while|whereas|which|who|whom|whose|that|if|when|unless|since|so that|even though|despite|provided|whether)\b/i;
  const cx = sents.filter(s => SUB.test(s)).length, ratio = sents.length ? Math.round(cx / sents.length * 100) : 0;
  add(ratio >= 40 ? 'ok' : 'warn', `複文（従属節を含む文）の割合 ${ratio}%`, ratio >= 40 ? '文の種類に変化があります。バンド6以上の目安を満たしています。' : '単文が多いです。文トレの「複文・構文」で練習した形を使ってみましょう。');
  // linkers
  const low = text.toLowerCase();
  const used = W.linkers.filter(l => new RegExp(`\\b${l.replace(/ /g, '\\s+')}\\b`).test(low));
  add(used.length >= 5 ? 'ok' : 'warn', `つなぎの言葉 ${used.length} 種類`, used.length >= 5 ? '文と文のつながりが示せています。' : 'However / Furthermore / As a result などを使って論理の流れを示しましょう（右の表現バンク参照）。', used);
  used.forEach(l => marks.push([new RegExp(`\\b${l.replace(/ /g, '\\s+')}\\b`, 'gi'), 'mk-link']));
  // grammar patterns typical for Japanese learners
  const errHits = [];
  W.errors.forEach(([src, fl, msg]) => { const re = new RegExp(src, fl.includes('g') ? fl : fl + 'g'); const m = text.match(re); if (m) { errHits.push(`${m[0]} → ${msg}`); marks.push([re, 'mk-err']); } });
  sents.forEach(s => { if (/^[a-z]/.test(s)) { errHits.push(`「${s.slice(0, 20)}…」→ 文頭は大文字`); } });
  if (/(^|\s)i(\s|')/.test(text)) { errHits.push('i → I（「私」は常に大文字）'); marks.push([/(?<=^|\s)i(?=\s|')/g, 'mk-err']); }
  if (/\s[,.!?;:]/.test(text)) errHits.push('句読点の前にスペースがあります');
  if (/[,.;:](?=[A-Za-z])/.test(text.replace(/\b(e\.g|i\.e|etc)\./gi, ''))) errHits.push('句読点の後にスペースがありません');
  add(errHits.length ? 'bad' : 'ok', errHits.length ? `よくある文法・表記の誤り ${errHits.length} 件` : 'よくある文法・表記の誤りは見つかりませんでした', errHits.length ? '日本語話者が間違えやすいパターンです。直してからもう一度チェックしましょう。' : 'チェックできるのは典型的なパターンだけです。時制や冠詞は自分でも見直しましょう。', errHits);
  // register
  if (formal) {
    const inf = [];
    W.informal.forEach(([src, fl, msg]) => { const re = new RegExp(src, fl + 'g'); const m = text.match(re); if (m) { inf.push(`${[...new Set(m.map(x => x.toLowerCase()))].join(', ')} → ${msg}`); marks.push([re, 'mk-inf']); } });
    sents.forEach(s => { const m = s.match(/^(And|But|So)\b/); if (m) inf.push(`文頭の ${m[1]} → ${{And:'In addition', But:'However', So:'Therefore'}[m[1]]}`); });
    add(inf.length ? 'warn' : 'ok', inf.length ? `くだけた表現 ${inf.length} 件` : '文体はフォーマルに保てています', inf.length ? 'このタスクでは書き言葉のフォーマルな表現が評価されます。' : '', inf);
  }
  // repetition
  const counts = {}; words.forEach(x => { const k = x.toLowerCase(); counts[k] = (counts[k] || 0) + 1; });
  const over = W.overused.filter(([wd, n]) => (counts[wd] || 0) + (wd === 'think' ? (counts['thinks'] || 0) : 0) > n).map(([wd, n, msg]) => `${wd} ×${counts[wd]} → ${msg}`);

function vocabHits(text) {
  const idx = formIndex(), hits = new Map();
  key(text).split(' ').forEach(t => { const w = idx.get(t); if (w) hits.set(w.id, w); });
  return [...hits.values()];
}
function markHits(text) {
  if (!text) return '';
  const idx = formIndex();
  return text.split(/(\s+)/).map(t => idx.has(key(t)) ? `<mark>${esc(t)}</mark>` : esc(t)).join('');
}
function speakStats() {
  const s = ui.spk, n = s.final.trim() ? s.final.trim().split(/\s+/).length : 0;
  const secs = Math.max(1, Math.round((s.t1 - s.t0) / 1000));
  const wpm = Math.round(n / secs * 60);
  const hits = vocabHits(s.final);
  const byLv = LEVELS.slice(2).map(l => [l, hits.filter(w => w.lv === l).length]);
  const pace = wpm < 90 ? 'ややゆっくり。言葉に詰まったら “Well, …” などでつなぎましょう' : wpm > 170 ? '速め。区切りを意識すると聞き取りやすくなります' : '自然なペースです';
  return `<div class="stats">
    <div class="stat"><b>${n}</b><span>語数</span></div>
    <div class="stat"><b>${secs}<small style="font-size:14px">秒</small></b><span>話した時間</span></div>
    <div class="stat"><b>${wpm}</b><span>1分あたりの語数</span></div>

  ${hits.length ? `<div class="wordpills">${hits.map(w => `<span class="wp">${lvChip(w.lv)} ${esc(w.w)}</span>`).join('')}</div>` : '<p class="small muted">B1 以上の収録語はまだ使われていません。下の候補語を1〜2個入れてみましょう。</p>'}

function spkTick() {
  const s = ui.spk; const left = Math.max(0, Math.ceil((s.end - Date.now()) / 1000));

}

  const s = ui.spk, part = PART[SPEAK_Q[s.qi].p];

async function spkTalk() {
  const s = ui.spk, part = PART[SPEAK_Q[s.qi].p];
  if (!SR) return;
  clearInterval(s.timer); if (TTS) speechSynthesis.cancel();
  Object.assign(s, {phase: 'talk', final: '', interim: '', err: '', t0: Date.now(), end: Date.now() + part.talk * 1000});
  if (s.audio) { URL.revokeObjectURL(s.audio); s.audio = null; }
  render();
  s.recorder = await startRecorder();
  const r = new SR(); r.lang = S.settings.accent; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) s.final = (s.final + ' ' + e.results[i][0].transcript).trim();
      else interim += e.results[i][0].transcript;
    }
    s.interim = interim;
    const t = document.getElementById('transcript'); if (t) t.innerHTML = esc(s.final) + ' <i>' + esc(s.interim) + '</i>';
  };

}
async function spkStop() {
  const s = ui.spk; if (s.phase !== 'talk' && s.phase !== 'prep') return;
  clearInterval(s.timer);
  const wasTalk = s.phase === 'talk';
  s.phase = wasTalk ? 'done' : 'idle'; s.t1 = Date.now();
  if (s.interim) { s.final = (s.final + ' ' + s.interim).trim(); s.interim = ''; }
  try { s.rec?.stop(); } catch (e) {}
  s.rec = null;
  if (s.recorder) { s.audio = await s.recorder.stop(); s.recorder = null; }
  if (S.tab === 'speak') render();
}
function spkReset() { const s = ui.spk; if (s.phase === 'talk' || s.phase === 'prep') { clearInterval(s.timer); s.phase = 'idle'; try { s.rec?.abort(); } catch (e) {} s.recorder?.stop(); s.rec = s.recorder = null; } s.phase = 'idle'; s.final = s.interim = s.err = ''; }

  },
  wcheck: () => { const t = $('#essay').value; setWText(t); if (!t.trim()) { ui.write.msg = 'まず本文を書いてください。'; return render(); } ui.write.msg = ''; ui.write.feedback = analyzeWriting(t, curPrompt()); render(); setTimeout(() => document.querySelector('.fb')?.scrollIntoView({behavior: 'smooth', block: 'start'}), 0); },
  wsave: () => {
    const t = $('#essay').value; if (!t.trim()) return;
    const n = (cleanText(t).match(/[A-Za-z][A-Za-z'’-]*/g) || []).length;
    S.drafts.unshift({id: Date.now().toString(36), task: ui.write.task, pi: ui.write.pi, text: t, words: n, ts: Date.now()});
    S.drafts = S.drafts.slice(0, 40); save(); ui.write.msg = '下書きを保存しました'; render();
  },
  wload: d => { const dr = S.drafts.find(x => x.id === d.id); if (!dr) return; ui.write.task = dr.task; ui.write.pi = dr.pi; S.wtext['p' + dr.pi] = dr.text; ui.write.feedback = null; aiReset(); ui.write.msg = '下書きを開きました'; save(); render(); },
  waskclear: () => { ui.write.confirm = true; render(); },
  wnoclear: () => { ui.write.confirm = false; render(); },
  waicheck: () => aiCheck(),
  wclear: () => { S.wtext[wKey()] = ''; ui.write.confirm = false; ui.write.feedback = null; aiReset(); save(); render(); },
  // pronunciation
  pmode: d => { ui.pron.mode = d.m; ui.pron.result = null; ui.pron.err = ''; render(); },
  pnav: d => { const n = filtered().length || 1; ui.pron.i = d.d === 'r' ? Math.random() * n | 0 : ui.pron.i + +d.d; ui.pron.result = null; ui.pron.err = ''; if (ui.pron.audio) { URL.revokeObjectURL(ui.pron.audio); ui.pron.audio = null; } render(); },
  pmic: () => pronMic(),
  toguide: () => { spkReset(); ui.pron.mode = 'guide'; S.tab = 'pron'; save(); render(); scrollTo({top: 0}); },
  // speaking
  spart: d => { spkReset(); ui.spk.part = +d.p; const qs = SPEAK_Q.map((q, i) => [q, i]).filter(([q]) => q.p === +d.p); ui.spk.qi = pick(qs)[1]; render(); },
  snew: () => { spkReset(); const qs = SPEAK_Q.map((q, i) => [q, i]).filter(([q, i]) => q.p === ui.spk.part && i !== ui.spk.qi); ui.spk.qi = pick(qs)[1]; render(); },
  sretry: () => { spkReset(); render(); },
  smodel: () => { ui.spk.modelFor = ui.spk.modelFor === ui.spk.qi ? null : ui.spk.qi; render(); },
  sprep: () => spkPrep(),
  stalk: () => spkTalk(),
  sstop: () => spkStop(),
  // settings
  import: () => importWords(),
  askconfirm: d => { ui.confirm = d.k; render(); },
  noconfirm: () => { ui.confirm = null; render(); },
  clearcustom: () => { S.custom = []; ui.confirm = null; ui.importMsg = ''; rebuild(); save(); renderBand(); render(); },
  keysave: () => { const v = ($('#apikey')?.value || '').trim(); if (!v) { ui.keyMsg = 'キーを貼り付けてから保存してください。'; return render(); } setApiKey(v); ui.keyMsg = v.startsWith('sk-ant-') ? '保存しました。ライティングの「AI添削」が使えます。' : '保存しました（sk-ant- で始まらないキーです。コピーし間違いがないか確認してください）。'; render(); },
  keydel: () => { setApiKey(''); ui.keyMsg = 'キーを削除しました。'; render(); },
  resetprog: () => { S.prog = {}; S.sprog = {}; ui.confirm = null; save(); render(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ACT[b.dataset.act]?.(b.dataset, b, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'dict') {
    const z = ui.quiz, q = z.qs[z.i]; if (q.pick !== null) return;
    q.typed = $('#dict').value; q.pick = 0; answerQuiz(key(q.typed) === key(q.w.w));
  }
  if (f === 'cloze') {
    const s = ui.sent, toks = s.item.en.split(/\s+/), ans = toks[clozeTarget(s.item)].replace(/[^A-Za-z'-]/g, '');
    s.typed = $('#scloze').value; if (!s.typed.trim()) return;
    const ok = key(s.typed) === key(ans); s.result = {ok}; markSent(s.item.id, ok); render();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'topic') { S.topic = t.value; ui.cram = false; ui.quiz = null; ui.sent.item = null; save(); render(); }
  if (t.id === 'accent') { S.settings.accent = t.value; S.settings.voice = ''; save(); render(); }
  if (t.id === 'voice') { S.settings.voice = t.value; save(); }
  if (t.id === 'rate') { S.settings.rate = +t.value; save(); }
  if (t.id === 'ssrc') { ui.sent.src = t.value; ui.sent.item = null; render(); }
  if (t.id === 'scat') { ui.sent.cat = t.value; ui.sent.item = null; render(); }
  if (t.id === 'wprompt') { ui.write.pi = +t.value; ui.write.feedback = null; aiReset(); ui.write.showModel = false; ui.write.msg = ''; render(); }
  if (t.id === 'wbank') { ui.write.bankCat = t.value; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'rate') $('#rateval').textContent = (+t.value).toFixed(1) + '×';
  if (t.id === 'search') { ui.search = t.value; const pos = t.selectionStart; render(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); }
  if (t.id === 'essay') setWText(t.value);
  if (t.id === 'strans') ui.sent.typed = t.value;
  if (t.id === 'scloze') ui.sent.typed = t.value;
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.tab === 'card') {
    const w = cardQueue()[0]; if (!w) return;
    if (e.code === 'Space') { e.preventDefault(); if (!ui.revealed) { ui.revealed = true; render(); } }
    else if (e.key === '1' && ui.revealed) grade(w.id, false);
    else if (e.key === '2' && ui.revealed) grade(w.id, true);
    else if (e.key === 'p' || e.key === 'P') speak(w.w);
  } else if (S.tab === 'quiz' && ui.quiz && !ui.quiz.done && !ui.quiz.error) {
    const z = ui.quiz, q = z.qs[z.i];
    if (e.key === 'Enter' && q.pick !== null) ACT.qnext();
    else if (/^[1-4]$/.test(e.key) && q.pick === null && z.mode !== 'dictation') ACT.answer({i: +e.key - 1});
  } else if (S.tab === 'sent' && e.key === 'Enter') {
    const s = ui.sent;
    if ((s.mode === 'order' && s.checked === true) || (s.mode === 'cloze' && s.result)) ACT.snext();
  }
});

renderBand();
render();
</script>
